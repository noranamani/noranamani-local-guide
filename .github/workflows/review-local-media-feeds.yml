name: One-time local media RSS metadata review

on:
  pull_request:
    paths:
      - "scripts/review_local_media_feeds.py"
      - ".github/workflows/review-local-media-feeds.yml"

permissions:
  contents: read

jobs:
  review:
    if: github.head_ref == 'phase1h-private-feeds-audit' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe only robots-permitted RSS endpoints once
        run: python -m scripts.review_local_media_feeds
