name: Audit local-guide automation health

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-health.yml'
      - 'scripts/ops_health.py'
      - 'data/source_state.json'
      - 'config/sources.json'
  schedule:
    # JST 22:47, after the morning and backup acquisition windows.
    - cron: '47 13 * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Refresh approved Akashi facility CSV'
      - 'Retire stale owner-reviewed event listings (offline)'
      - 'Verify published Harima Pages site'
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: harima-operations-issue-audit
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.repository == 'noranamani/noranamani-local-guide' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_repository.full_name == 'noranamani/noranamani-local-guide' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate last successful source refresh and policy deadline
        id: health
        env:
          RELATED_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: python -m scripts.ops_health
      - name: Create one deduplicated operations issue if an action is required
        if: steps.health.outputs.alert == 'true'
        uses: actions/github-script@v7
        env:
          HEALTH_CODES: ${{ steps.health.outputs.codes }}
          RELATED_RUN_URL: ${{ github.event.workflow_run.html_url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const title = '【はりまよりみち】自動更新の要確認';
            const open = await github.paginate(github.rest.issues.listForRepo,
              {owner, repo, state: 'open', per_page: 100});
            if (open.some(x => !x.pull_request && x.title === title)) {
              core.info('An operations issue is already open; no duplicate created.');
              return;
            }
            const reason = process.env.HEALTH_CODES || 'unknown';
            const runUrl = process.env.RELATED_RUN_URL ||
              `https://github.com/${owner}/${repo}/actions`;
            await github.rest.issues.create({
              owner, repo, title,
              body: [
                '自動診断が更新停止・データ鮮度・情報源審査期限のいずれかを検出しました。',
                '',
                '- 検出コード: `' + reason + '`',
                '- 関連する実行: ' + runUrl,
                '- 確認先: data/source_state.json、config/sources.json、Actionsの各実行ログ',
                '',
                '原則: 同じ日本時間の日付で公式CSVへのリクエストは最大1回。',
                '許諾・robots・アクセス拒否の停止は人手の確認なしに解除しない。',
                '既存の施設データを偽の最終確認日時で更新しない。',
                '',
                '対応・確認が済むまでこのIssueを開いたままにしてください。'
              ].join('\n')
            });
      - name: Close previously opened operations issue only when the complete health assessment is clean
        if: steps.health.outputs.alert == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const title = '【はりまよりみち】自動更新の要確認';
            const open = await github.paginate(github.rest.issues.listForRepo,
              {owner, repo, state: 'open', per_page: 100});
            const issues = open.filter(x =>
              !x.pull_request &&
              x.title === title &&
              typeof x.body === 'string' &&
              x.body.startsWith('自動診断が更新停止・データ鮮度・情報源審査期限'));
            if (issues.length > 1) {
              core.setFailed('More than one matching operations issue; manual review required.');
              return;
            }
            if (issues.length === 0) {
              core.info('No outdated operations issue to close.');
              return;
            }
            const issue_number = issues[0].number;
            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: '更新監査で自動取得の停止・データ鮮度・情報源の期限について問題未検出となりました。'
                + ' このIssueは解消済みとして閉じます。'
                + ' 新しい異常が発生した場合は同じ監視ワークフローが再度Issueを作成します。'
                + ' 無許可の情報源を有効化したり、データ取得時刻を書き換えたりしていません。'
            });
            await github.rest.issues.update({
              owner, repo, issue_number, state: 'closed', state_reason: 'completed'
            });
