name: Offline Python tests and unpublished preview

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tested dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -q

  preview:
    needs: unittest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tested dependencies
        run: python -m pip install -r requirements.txt
      - name: Build site from already checked-in records (no network collection)
        run: python -m localguide build
      - name: Validate generated static files and SEO directives
        run: python -m localguide validate --site
      - name: Record privacy-safe preview inventory
        run: python -m scripts.preview_report --output preview-report.md
      - name: Upload preview files (not deployed to Pages)
        uses: actions/upload-artifact@v4
        with:
          name: unpublished-local-guide-preview
          path: |
            docs/
            preview-report.md
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 7
